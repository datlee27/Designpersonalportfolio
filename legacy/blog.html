    <!-- Featured Section -->
    <section class="featured-section">
        <div class="container">
            <div class="featured-header">
                <div class="featured-line"></div>
                <h2 class="featured-title">Featured</h2>
            </div>
        </div>
    </section>

    <!-- Blog Posts -->
    <section class="blog-posts">
        <div class="container">
            <!-- Blog posts sẽ được tự động tạo bởi blog-posts-loader.js -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="blog-footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-brand">
                    <h2 class="footer-logo">Portfolio</h2>
                    <div class="footer-links">
                        <a href="/">Home</a>
                        <a href="/blog">Blog</a>
                    </div>
                </div>
                <div class="footer-newsletter">
                    <div class="newsletter-header">
                        <div class="newsletter-line"></div>
                        <h3 class="newsletter-title">The Developer's Newsletter</h3>
                    </div>
                    <form class="newsletter-form" id="newsletterForm">
                        <input type="email" placeholder="Email *" required class="newsletter-input">
                        <button type="submit" class="newsletter-btn">Subscribe</button>
                    </form>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2025 Portfolio. Designed & Built with passion.</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Mobile Menu Toggle
            const mobileMenuToggle = document.getElementById('mobileMenuToggle');
            const mobileMenu = document.getElementById('mobileMenu');

            if (mobileMenuToggle && mobileMenu) {
                mobileMenuToggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    mobileMenu.classList.toggle('active');

                    // Animate hamburger to X
                    const spans = mobileMenuToggle.querySelectorAll('span');
                    if (mobileMenu.classList.contains('active')) {
                        spans[0].style.transform = 'rotate(45deg) translateY(8px)';
                        spans[1].style.opacity = '0';
                        spans[2].style.transform = 'rotate(-45deg) translateY(-8px)';
                    } else {
                        spans[0].style.transform = 'none';
                        spans[1].style.opacity = '1';
                        spans[2].style.transform = 'none';
                    }
                });

                // Close mobile menu when clicking outside
                document.addEventListener('click', function (e) {
                    if (mobileMenu.classList.contains('active')) {
                        if (!mobileMenu.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
                            mobileMenu.classList.remove('active');
                            const spans = mobileMenuToggle.querySelectorAll('span');
                            spans[0].style.transform = 'none';
                            spans[1].style.opacity = '1';
                            spans[2].style.transform = 'none';
                        }
                    }
                });
            }
        });
    </script>
    <script src="blog-posts-loader.js"></script>
    <script src="blog-analytics-mysql.js"></script>
    <script src="blog-script.js"></script>
</body>

</html>
